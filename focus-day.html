<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分心的第一天</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D classroom; HUD pinned like things on a classroom wall — 課表 top-left, meters top-right, 字幕 bottom; every menu is a chalkboard card. Single dark look by choice. */
:root{
  --board:#1f3b2e; --board-deep:#10201a; --frame:#8a6a44;
  --chalk:#eef3e2; --chalk-dim:#a3b6a1; --chalk-yellow:#f4d77a;
  --paper:#f7f2e2; --ink:#1d2421; --rule:#c4d3e4; --red:#d24a3e;
  --amber:#f2b23b; --calm:#62cfa5; --shade:rgba(9,16,13,.8);
  --f-chalk:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--board-deep);color:var(--chalk);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(8,10,14,.85) 100%);transition:opacity .25s}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 30px rgba(210,60,50,.75)}
#flash.on{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#hud{position:fixed;inset:0;pointer-events:none;font-size:15px}
#hud[data-off]{display:none}

#sched{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--paper);color:var(--ink);border-radius:4px;padding:8px 14px 9px;box-shadow:0 6px 18px rgba(0,0,0,.35);min-width:150px;transform:rotate(-1.2deg)}
#sched .mode{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--red)}
#sched .mode.support{color:#1d8a62}
#sched .time{font-family:var(--f-chalk);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
#sched .period{font-size:13px;font-weight:500}

#meters{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.meter{display:flex;align-items:center;gap:8px;background:var(--shade);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700}
.meter i{display:block;width:130px;height:9px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.meter b{display:block;height:100%;width:50%;background:var(--calm);border-radius:9px;transition:width .15s,background .3s}
#mRest b{background:var(--amber)}
.timer{background:var(--shade);padding:6px 12px;border-radius:999px;font-weight:900;font-variant-numeric:tabular-nums;font-size:16px}
.timer.low{color:#ff8b7d}
.voice{font-size:12px;color:var(--chalk-dim);background:var(--shade);padding:3px 10px;border-radius:999px}

#tasks{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:118px;width:240px;background:var(--paper) repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);color:var(--ink);border-left:4px solid var(--red);border-radius:3px;padding:10px 14px 12px;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:opacity .9s}
#tasks h3{margin:0 0 4px;font-family:var(--f-chalk);font-size:19px}
#tasks ul{list-style:none;margin:0;padding:0;font-size:15px;line-height:28px}
#tasks li.done{text-decoration:line-through;color:#6a7a6f}
#tasks li.unk{color:#9a6b2f;font-style:italic}
#tasks li::before{content:"□ ";}
#tasks li.done::before{content:"☑ ";}
#tasks.faded{opacity:0}
#recallHint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:118px;margin:0;background:var(--shade);padding:6px 12px;border-radius:6px;font-size:14px}

#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.8);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#cross.on{border-color:var(--calm)}
#labels,#thoughts{position:absolute;inset:0;overflow:hidden}
.dlabel{position:absolute;transform:translate(-50%,-120%);background:var(--amber);color:#2a1b00;font-weight:900;font-size:15px;padding:5px 11px;border-radius:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:pulse .6s ease-in-out infinite alternate}
.dlabel.decoy{background:#ffe08a}
@keyframes pulse{to{transform:translate(-50%,-128%) scale(1.06)}}
.thought{position:absolute;font-family:var(--f-chalk);font-size:22px;color:rgba(255,255,255,.92);background:rgba(30,40,60,.45);padding:6px 14px;border-radius:22px;text-shadow:0 1px 3px rgba(0,0,0,.6);animation:drift 6s ease-in-out forwards;white-space:nowrap}
@keyframes drift{0%{opacity:0;transform:translate(0,10px)}15%{opacity:1}80%{opacity:.9}100%{opacity:0;transform:translate(60px,-50px)}}

#prompt{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);background:var(--shade);padding:7px 14px;border-radius:8px;font-weight:700;font-size:15px;white-space:nowrap}
#prompt:empty{display:none}
kbd{display:inline-block;min-width:1.4em;text-align:center;font-family:var(--f-ui);font-weight:900;background:var(--chalk);color:var(--ink);border-radius:4px;padding:0 5px;margin:0 2px;box-shadow:0 2px 0 rgba(0,0,0,.4);font-size:.9em}

#sub{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(860px,calc(100% - 32px));background:rgba(5,8,7,.78);padding:10px 18px;border-radius:8px;font-size:21px;line-height:1.5;text-align:center}
#sub:empty,#sub.empty{display:none}
#sub .who{color:var(--chalk-yellow);font-weight:700;margin-right:8px;font-size:16px}
#sub .miss{color:#6d7a72;letter-spacing:.04em}
#sub .now{text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:5px}

#toasts{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px))}
.toast{background:var(--shade);border-left:4px solid var(--chalk-dim);padding:9px 14px;border-radius:6px;font-size:16px;line-height:1.45;transition:opacity .5s,transform .5s;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.toast.alert{border-color:var(--red);background:rgba(70,14,10,.88)}
.toast.calm{border-color:var(--calm);background:rgba(10,52,38,.88)}
.toast.good{border-color:var(--chalk-yellow)}
.toast.out{opacity:0;transform:translateY(-8px)}

#impulse{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#impulse .ring{position:relative;width:150px;height:150px}
#impulse svg{width:100%;height:100%;transform:rotate(-90deg)}
#impulse circle{fill:none;stroke-width:9}
#impulse .bg{stroke:rgba(255,255,255,.18)}
#impulse .fg{stroke:var(--calm);stroke-dasharray:327;stroke-dashoffset:327;stroke-linecap:round}
#impulse .txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-chalk);font-size:22px;font-weight:700;line-height:1.2;padding:16px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#impulse .tbar{width:200px;height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
#impulse .tbar b{display:block;height:100%;background:var(--red);width:100%}
#impulse p{margin:0;background:var(--shade);padding:5px 12px;border-radius:6px;font-weight:700}
#stopcard{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:160px;background:var(--paper);color:var(--ink);font-family:var(--f-chalk);font-size:20px;font-weight:700;padding:8px 14px;border-radius:4px;transform:rotate(2deg);box-shadow:0 6px 16px rgba(0,0,0,.35)}

#math{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--shade);padding:10px 14px;border-radius:10px;pointer-events:auto}
#math .q{font-family:var(--f-chalk);font-size:24px;margin-right:6px;white-space:nowrap}
#math button{font:inherit;font-weight:900;font-size:20px;background:var(--chalk);color:var(--ink);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;min-width:84px}
#math button:focus-visible{outline:3px solid var(--chalk-yellow)}
#math .hint{font-size:15px;color:var(--chalk-dim)}

#absorb{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,18,26,.72);opacity:0;pointer-events:none;transition:opacity .35s;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#absorb.on{opacity:1}
#absorb p{font-family:var(--f-chalk);font-size:clamp(22px,3.4vw,34px);max-width:28em;text-align:center;line-height:1.5;margin:0}

#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,12,9,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{position:relative;background:var(--board);border:12px solid var(--frame);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 80px rgba(0,0,0,.35);padding:28px clamp(18px,4vw,40px) 26px;max-width:760px;width:100%;box-sizing:border-box;max-height:calc(100vh - 40px);overflow:auto}
.card h1{font-family:var(--f-chalk);font-weight:700;font-size:clamp(40px,7vw,68px);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.02em}
.card h2{font-family:var(--f-chalk);font-weight:700;font-size:clamp(28px,4.4vw,40px);margin:0 0 6px;line-height:1.15;text-wrap:balance}
.card h3{font-family:var(--f-chalk);font-size:22px;margin:22px 0 8px;color:var(--chalk-yellow)}
.card p,.card li{font-size:16px;line-height:1.75;color:var(--chalk)}
.card .lead{font-size:18px}
.card .eyebrow{font-size:13px;letter-spacing:.14em;color:var(--chalk-dim);font-weight:700;margin:0 0 8px}
.card .stamp{font-family:var(--f-chalk);font-size:22px;color:var(--chalk-yellow)}
.card ul{padding-left:1.2em;margin:6px 0}
.card .note{font-size:14px;color:var(--chalk-dim);border-top:1px dashed rgba(238,243,226,.25);padding-top:12px;margin-top:18px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;margin:12px 0;font-size:15px}
.ctrls div{display:flex;gap:8px;align-items:center}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;background:var(--chalk);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.alt{background:transparent;color:var(--chalk);border:2px solid rgba(238,243,226,.5);box-shadow:none}
.btn.calm{background:var(--calm);color:#062217}
.btn:focus-visible{outline:3px solid var(--chalk-yellow);outline-offset:2px}
.btn:active{transform:translateY(2px)}
.check{display:flex;gap:8px;align-items:center;font-size:15px;margin-top:10px;color:var(--chalk-dim)}
.recap p{font-size:19px;line-height:1.8;margin:6px 0;font-family:var(--f-chalk)}
.recap .miss{color:#6f8473;letter-spacing:.03em}
.stats{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px;font-variant-numeric:tabular-nums}
.stats th,.stats td{padding:7px 8px;border-bottom:1px solid rgba(238,243,226,.15);text-align:left}
.stats td.n{text-align:right;font-weight:700;font-size:17px;white-space:nowrap}
.stats th{color:var(--chalk-dim);font-weight:500;font-size:13px}
.tablewrap{overflow-x:auto}
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px 16px;font-size:15px;line-height:1.6}
.map b{color:var(--chalk-yellow);font-weight:700}
@media (max-width:560px){.map{grid-template-columns:1fr}.map b{margin-top:6px}}

#touch{position:fixed;inset:0;pointer-events:none}
#touch .pad{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
#touch .acts{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,64px);gap:8px}
#touch button{pointer-events:auto;font:inherit;font-weight:900;font-size:17px;border:0;border-radius:12px;background:rgba(238,243,226,.22);color:#fff;touch-action:none}
#touch button:active{background:rgba(238,243,226,.45)}
@media (max-width:640px){#tasks{top:110px;width:200px;font-size:14px}.meter i{width:80px}#sub{font-size:17px;bottom:calc(200px + env(safe-area-inset-bottom,0px))}#math{bottom:calc(250px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;justify-content:center}}
@media (prefers-reduced-motion:reduce){.thought{animation:fadeonly 6s forwards}@keyframes fadeonly{0%,100%{opacity:0}15%,80%{opacity:1}}.dlabel{animation:none}}
</style>

<canvas id="game"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="hud" data-off>
  <div id="sched"><div class="mode" id="modeChip">體驗模式</div><div class="time" id="clockTxt">08:10</div><div class="period" id="periodTxt">第一節・導師時間</div></div>
  <div id="meters">
    <div class="meter" id="mFocus"><span>專注</span><i><b></b></i></div>
    <div class="meter" id="mRest" hidden><span>坐不住</span><i><b></b></i></div>
    <div class="timer" id="mTimer" hidden>下課剩 10:00</div>
    <div class="voice" id="voiceTxt">V 鍵：老師語音 開</div>
  </div>
  <div id="tasks" hidden><h3 id="taskTitle">要做的事</h3><ul id="taskList"></ul></div>
  <p id="recallHint" hidden>想不起來要做什麼？按 <kbd>Q</kbd> 回想</p>
  <div id="stopcard" hidden>停 → 想 → 做</div>
  <div id="labels"></div>
  <div id="thoughts"></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="impulse" hidden><div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="impArc" cx="60" cy="60" r="52"/></svg><div class="txt" id="impTxt"></div></div><div class="tbar"><b id="impTime"></b></div><p>按住 <kbd>空白鍵</kbd> 停一下、想一想</p></div>
  <div id="math" hidden></div>
  <div id="sub" class="empty"><span class="who" id="subWho"></span><span id="subTxt"></span></div>

</div>

  </div>
  <div class="acts">
    <button data-key="KeyE">E 互動</button><button data-key="KeyQ">Q 回想</button>
    <button data-key="Space">停一下</button><button data-key="KeyF">F 動一動</button>
  </div>
</div>
<div id="overlay" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!--FX-KIT START-->
<script>window.__FX={"sunBoost": 2.1, "ambScale": 0.72, "range": 18, "bloom": 0.42, "thresh": 0.8, "vig": 0.3, "contrast": 1.1, "sat": 1.12, "expo": 1.02, "dust": 1, "dustN": 500, "dustSize": 0.014, "patchOpacity": 0.0, "beamOpacity": 0.15, "beamDir": [12, -14, -5], "beams": [{"c": [-7.1, 1.8, -3.6], "w": 2.6, "h": 1.6, "axis": "x"}, {"c": [-7.1, 1.8, 0], "w": 2.6, "h": 1.6, "axis": "x"}, {"c": [-7.1, 1.8, 3.6], "w": 2.6, "h": 1.6, "axis": "x"}]};</script>
<script>
/* FX kit：把既有 three.js r128 遊戲升級為 PBR 材質、即時陰影（跟著鏡頭走的太陽陰影）、
   泛光＋調色＋暗角＋顆粒後製，以及漂浮微塵。每款遊戲在載入前用 window.__FX 調參數。 */
(function(){
'use strict';
if(!window.THREE||THREE.__fx)return;THREE.__fx=true;
const T=THREE;
const C=Object.assign({
 rough:.8,metal:0,
 shadow:true,range:24,mapSize:2048,castMax:Infinity,noCastAbove:Infinity,follow:true,sunBoost:1,addSun:null,
 bloom:.5,thresh:.72,knee:.25,vig:.35,sat:1.08,contrast:1.06,tint:[1.02,1,.97],grain:.02,ca:.0015,lift:0,
 dust:0,dustN:600,dustBox:14,dustColor:'#fff1d6',dustSize:.02,dustRise:0,
 zones:null,beams:null,beamDir:[-1,-.7,-.2],beamColor:'#ffd9a0',beamOpacity:.12,patchOpacity:.28,expo:1,
 off:false
},window.__FX||{});
window.__FX=C;

// 1. PBR：把 Lambert／Phong 換成 MeshStandardMaterial
const STRIP=['shininess','specular','reflectivity','refractionRatio','combine','specularMap'];
function std(){return class extends T.MeshStandardMaterial{constructor(p){const q=Object.assign({roughness:C.rough,metalness:C.metal},p||{});STRIP.forEach(k=>delete q[k]);super(q);}};}
T.MeshLambertMaterial=std();T.MeshPhongMaterial=std();

// 2. renderer
const R0=T.WebGLRenderer;
function R(p){const r=new R0(p);install(r);return r;}
R.prototype=R0.prototype;T.WebGLRenderer=R;

function install(r){
 r.shadowMap.enabled=!!C.shadow;r.shadowMap.type=T.PCFSoftShadowMap;
 const raw=r.render.bind(r);r.__fxRaw=raw;
 let P=null,frame=0,sun=null,sunOff=null,dust=null,sunBase=0,zk=1,zs=1;const ambs=[];
 const box=new T.Box3(),sz=new T.Vector3(),tmp=new T.Vector3(),fwd=new T.Vector3();

 function pickSun(scene){
  let best=null;scene.traverse(o=>{if(o.isDirectionalLight&&(!best||o.intensity>best.intensity))best=o;});
  if(!best&&C.addSun){const s=C.addSun;best=new T.DirectionalLight(s.color||0xfff0dd,s.intensity??.8);best.position.set(...(s.dir||[30,50,20]));scene.add(best);}
  scene.traverse(o=>{if(o.isAmbientLight||o.isHemisphereLight){if(C.ambScale!=null)o.intensity*=C.ambScale;ambs.push([o,o.intensity]);}});
  if(!best)return;
  sun=best;best.intensity*=C.sunBoost;sunBase=best.intensity;best.castShadow=true;
  best.shadow.mapSize.set(C.mapSize,C.mapSize);best.shadow.bias=-.0004;best.shadow.normalBias=.03;
  const c=best.shadow.camera;c.left=-C.range;c.right=C.range;c.top=C.range;c.bottom=-C.range;c.near=.5;c.far=C.range*8;c.updateProjectionMatrix();
  if(!best.target.parent)scene.add(best.target);
  sunOff=best.position.clone().sub(best.target.position);if(sunOff.lengthSq()<1e-6)sunOff.set(1,2,1);sunOff.normalize();
 }
 let beamsDone=false;
 function addBeams(scene){
  beamsDone=true;if(!C.beams||!C.beams.length)return;
  const dir=new T.Vector3(...C.beamDir).normalize();
  const bm=new T.ShaderMaterial({transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide,uniforms:{uC:{value:new T.Color(C.beamColor)},uO:{value:C.beamOpacity}},
   vertexShader:'attribute float aF;varying float vF;void main(){vF=aF;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
   fragmentShader:'uniform vec3 uC;uniform float uO;varying float vF;void main(){gl_FragColor=vec4(uC*uO*vF*vF,1.);}'});
  const pm=new T.MeshBasicMaterial({color:C.beamColor,transparent:true,opacity:C.patchOpacity,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2});
  C.beams.forEach(b=>{
   const [x,y,z]=b.c,hw=b.w/2,hh=b.h/2,fy=b.floor??0;
   const Q=b.axis==='z'?[[x-hw,y-hh,z],[x+hw,y-hh,z],[x+hw,y+hh,z],[x-hw,y+hh,z]]:[[x,y-hh,z-hw],[x,y-hh,z+hw],[x,y+hh,z+hw],[x,y+hh,z-hw]];
   const W=Q.map(q=>new T.Vector3(...q));

function move(dt,speed=2.5){
  let f=((keys.KeyW||keys.ArrowUp||touchDir.up)?1:0)-((keys.KeyS||keys.ArrowDown||touchDir.down)?1:0);
  let s=((keys.KeyD||keys.ArrowRight||touchDir.right)?1:0)-((keys.KeyA||keys.ArrowLeft||touchDir.left)?1:0);
  if(!f&&!s)return false;
  const l=Math.hypot(f,s);f/=l;s/=l;
  const fx=-Math.sin(state.yaw),fz=-Math.cos(state.yaw),rx=Math.cos(state.yaw),rz=-Math.sin(state.yaw);
  tryMove((fx*f+rx*s)*speed*dt,(fz*f+rz*s)*speed*dt);state.bobT+=dt*9;return true;
}
function walkToward(p,speed,dt){const dx=p.x-state.pos.x,dz=p.z-state.pos.z,d=Math.hypot(dx,dz);if(d<1.2)return;tryMove(dx/d*speed*dt,dz/d*speed*dt);state.bobT+=dt*7;}
function pullToward(p,strength,dt){
  const dx=p.x-camera.position.x,dz=p.z-camera.position.z,dy=p.y-camera.position.y;
  const k=Math.min(1,strength*dt);
  state.yaw+=wrap(Math.atan2(-dx,-dz)-state.yaw)*k;
  state.pitch+=(Math.atan2(dy,Math.hypot(dx,dz))-state.pitch)*k*.6;
}

}

function findTarget(list){
  let best=null,ba=1e9;camera.getWorldDirection(_f);
  for(const it of list){if(it.active&&!it.active())continue;const p=it.pos();_d.copy(p).sub(camera.position);const d=_d.length();if(d>(it.range||2.7))continue;const a=_f.angleTo(_d.normalize());const lim=Math.max(.22,Math.atan2(it.size||.3,d));if(a<lim&&a<ba){ba=a;best=it;}}
  return best;
}

  },
  update(dt){

const QS=[{q:'8 × 7 = ?',o:['54','56','63'],a:1},{q:'36 ÷ 4 = ?',o:['9','8','6'],a:0},{q:'125 + 38 = ?',o:['153','173','163'],a:2}];
PH.p4={
  start(){
    seatPlayer();state.yaw=0;state.pitch=0;gameClock=9*60+10;setPeriod('第二節・數學');
    teacher.position.set(-2.2,0,-5.0);teacher.rotation.y=Math.PI;
    Object.assign(P,{q:0,rest:15,tstate:'face',tt:4,order:[0,1,2],shuf:0,done:false,warnT:0});
    boardState={kind:'math',i:0,q:QS[0].q};drawBoard();
    hud({rest:true,math:true});dist.reset(5);thoughts.reset();AU.chatterLevel=.01;
    renderMath(true);

  },
  update(dt){

    if(P.rest>=100){P.warnT-=dt;if(P.warnT<=0){P.warnT=6;toast('腳一直想動，身體好像有馬達……題目都看不進去了。');}}
    // teacher alternates between facing class and writing on board
    P.tt-=dt;if(P.tt<=0){P.tstate=P.tstate==='face'?'write':'face';P.tt=rand(3,5);}
    const ty=P.tstate==='face'?Math.PI:0;teacher.rotation.y+=wrap(ty-teacher.rotation.y)*Math.min(1,dt*4);
    teacher.userData.armR.rotation.x=P.tstate==='write'?1.9+Math.sin(performance.now()/120)*.15:0;
    // shuffle answers when overloaded
    if(P.rest>85){P.shuf-=dt;if(P.shuf<=0){P.shuf=.8;P.order.sort(()=>Math.random()-.5);P.dirty=true;}}

  key(code){

};
let mathShown='';
function renderMath(f){
  const q=QS[P.q];const key=(f?'f':'n')+P.q+P.order.join('')+(P.rest>85?'x':'');
  if(key===mathShown&&!P.dirty)return;mathShown=key;P.dirty=false;
  const el=$('#math');
  if(!f){el.innerHTML='<span class="hint">（抬頭看黑板，才看得到題目）</span>';return;}
  el.innerHTML=`<span class="q">${q.q}</span>`+P.order.map((oi,i)=>`<button data-n="${i}">${i+1}．${P.rest>85?scramble(q.o[oi]):q.o[oi]}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.n)));
}
function scramble(s){return s.split('').map(ch=>Math.random()<.5?ch:pick(['3','5','6','8','9'])).join('');}
function answer(n){
  if(P.done||state.paused||state.frozen)return;
  if(angleTo(boardCenter)>=.45){toast('你沒在看黑板，不知道題目是什麼。');return;}
  const q=QS[P.q];
  if(P.order[n]===q.a){sfx('ding');P.q++;P.order=[0,1,2];mathShown='';
    if(P.q>=QS.length){P.done=true;boardState={kind:'done'};drawBoard();toast('小考寫完了！','good');setTimeout(()=>{sfx('bell');},600);setTimeout(finish,3200);return;}
    boardState={kind:'math',i:P.q,q:QS[P.q].q};drawBoard();toast(`答對了！第 ${P.q+1} 題。`,'good');
  }else{S.mathWrong++;sfx('buzz');toast(P.rest>85?'答錯了……剛剛那個數字明明不是這樣？':'答錯了，再看一次。','alert');}
}
function fidget(){
  if(P.done)return;S.fidgets++;
  if(C().fidgetOK){P.rest=0;sfx('pop');toast('你捏了捏捏捏球，身體安靜下來了。','calm');return;}

function animateWorld(dt,t){

  const m=gameClock;hHour.rotation.z=-((m/60)%12)/12*Math.PI*2;hMin.rotation.z=-(m%60)/60*Math.PI*2;hSec.rotation.z=-Math.floor(t%60)/60*Math.PI*2;
  if(state.running&&state.phase!=='p3')$('#clockTxt').textContent=clockStr(gameClock);
  if(state.stareT>0)state.stareT-=dt;
  const cp=camera.position;
  students.forEach(s=>{const h=s.g.userData.head;let target=Math.sin(t*.5+s.g.userData.phase)*.12;
    if(state.stareT>0){const d=Math.hypot(s.x-cp.x,s.z+.48-cp.z);if(d<6){target=clamp(wrap(Math.atan2(-(cp.x-s.x),-(cp.z-(s.z+.48)))),-2.6,2.6);}}

  walkers.forEach(w=>{const p=w.g.position;p.z+=w.dir*w.speed*dt;if(p.z>5.5)w.dir=-1;if(p.z<-20.5)w.dir=1;w.g.rotation.y=w.dir>0?Math.PI:0;p.y=Math.abs(Math.sin(t*6*w.speed))*.04;});
  ball.position.y=.12+Math.abs(Math.sin(t*3.2))*.9;ballKid.userData.armR.rotation.x=1.2+Math.sin(t*6.4)*.3;
  friends[1].userData.armR.rotation.z=2.4+Math.sin(t*7)*.4;
  spinnerM.rotation.y+=dt*(C().decoys?14:0);

  const dt=Math.min(.05,(now-last)/1000);last=now;
  animateWorld(dt,now/1000);
  if(state.frozen>0){state.frozen-=dt;if(state.frozen<=0){state.frozen=0;$('#absorb').classList.remove('on');const cb=state.onUnfreeze;state.onUnfreeze=null;cb&&cb();}}
  else if(state.running&&!state.paused){const ph=PH[state.phase];ph&&ph.update(dt);}
  if(state.running&&state.phase==='p1'){$('#vig').style.opacity=((1-state.focusLevel)*.65).toFixed(2);setMeter('#mFocus',state.focusLevel*100,state.focusLevel<.4?'#e5533f':'');$('#cross').classList.toggle('on',state.focusLevel>.5);}
  else $('#cross').classList.remove('on');
  applyCamera();
  dist.list.forEach(a=>placeLabel(a.el,a.def.pos()));
  renderer.render(scene,camera);
}
setMode('sim');seatPlayer();
requestAnimationFrame(frame);
title();
})();
</script>
